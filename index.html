<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#202127">
<title>Nitro Generator • Redzzz</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#202127;color:#f2f3f5;font-family:Arial,Helvetica,sans-serif}
main{width:100%;max-width:460px;background:#2b2d31;padding:26px;border-radius:12px}
h1{font-size:25px;text-align:center;margin:0 0 8px}p{font-size:13px;color:#b5bac1;text-align:center;line-height:1.5;margin:0 0 22px}
label{display:block;font-size:13px;font-weight:bold;margin-bottom:8px}
.controls{display:flex;gap:9px}input{min-width:0;width:100%;background:#1e1f22;color:white;border:1px solid #41434a;border-radius:6px;padding:12px;font-size:16px;outline:none}input:focus{border-color:#ed4245}
button{border:0;border-radius:6px;padding:11px 15px;background:#ed4245;color:white;font-size:14px;font-weight:bold;cursor:pointer}button:hover{background:#c9343b}
#resultados{display:grid;gap:8px;margin-top:18px}.item{display:flex;align-items:center;gap:8px;padding:9px;background:#1e1f22;border-radius:6px}.codigo{font:12px monospace;overflow-wrap:anywhere;flex:1;color:#f2a1a3}.copiar{padding:7px 10px;font-size:12px;flex-shrink:0;background:#3b3d45}.copiar:hover{background:#50525c}
.aviso{font-size:11px;color:#949ba4;text-align:center;margin:16px 0 0}
@media(max-width:380px){main{padding:18px}.controls{flex-direction:column}.controls button{width:100%}}
</style>
</head>
<body>
<main>
  <h1>Nitro Generator</h1>
  <p>By Redzzz</p>
  <label for="quantidade">Quantidade de códigos</label>
  <div class="controls">
    <input id="quantidade" type="number" min="1" max="100" value="10" inputmode="numeric">
    <button id="gerar" type="button">Gerar</button>
  </div>
  <div id="resultados" aria-live="polite"></div>
  <div class="aviso">Códigos aleatórios para demonstração. Não são códigos Nitro válidos.</div>
</main>
<script>
const quantidade = document.getElementById('quantidade');
const resultados = document.getElementById('resultados');

function codigoAleatorio(tamanho = 16) {
  const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  const valores = new Uint32Array(tamanho);
  if (window.crypto && window.crypto.getRandomValues) {
    window.crypto.getRandomValues(valores);
    return Array.from(valores, n => chars[n % chars.length]).join('');
  }
  return Array.from({length:tamanho}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
}

async function copiar(texto, botao) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(texto);
    } else {
      const area = document.createElement('textarea');
      area.value = texto;
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      const ok = document.execCommand('copy');
      area.remove();
      if (!ok) throw new Error('copy failed');
    }
    const original = botao.textContent;
    botao.textContent = 'Copiado!';
    setTimeout(() => botao.textContent = original, 1200);
  } catch {
    botao.textContent = 'Falhou';
    setTimeout(() => botao.textContent = 'Copiar', 1200);
  }
}

function gerar() {
  const total = Number(quantidade.value);
  if (!Number.isInteger(total) || total < 1 || total > 100) {
    quantidade.focus();
    quantidade.setCustomValidity('Digite um número inteiro entre 1 e 100.');
    quantidade.reportValidity();
    quantidade.setCustomValidity('');
    return;
  }

  resultados.replaceChildren();
  const fragmento = document.createDocumentFragment();
  for (let i = 0; i < total; i++) {
    const link = 'https://discord.gift/' + codigoAleatorio();
    const item = document.createElement('div');
    item.className = 'item';

    const texto = document.createElement('span');
    texto.className = 'codigo';
    texto.textContent = link;

    const botao = document.createElement('button');
    botao.className = 'copiar';
    botao.type = 'button';
    botao.textContent = 'Copiar';
    botao.addEventListener('click', () => copiar(link, botao));

    item.append(texto, botao);
    fragmento.appendChild(item);
  }
  resultados.appendChild(fragmento);
}

document.getElementById('gerar').addEventListener('click', gerar);
quantidade.addEventListener('keydown', event => {
  if (event.key === 'Enter') gerar();
});
</script>
</body>
</html>
