<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Nitro Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'GG Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #313338;
            color: #dbdee1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #2b2d31;
            width: 100%;
            max-width: 550px;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #f2f3f5;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .header p {
            color: #949ba4;
            font-size: 14px;
        }
        .aviso-box {
            background-color: rgba(242, 63, 66, 0.1);
            border: 1px solid #f23f43;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
        }
        .aviso-title {
            color: #f23f43;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .aviso-text {
            color: #dbdee1;
            font-size: 13px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #b5bac1;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .input-row {
            display: flex;
            gap: 12px;
        }
        input[type="number"] {
            flex: 1;
            background-color: #1e1f22;
            border: none;
            border-radius: 4px;
            color: #f2f3f5;
            padding: 10px;
            font-size: 16px;
            outline: none;
        }
        button {
            background-color: #5865f2;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #4752c4;
        }
        .resultados-wrapper {
            background-color: #1e1f22;
            border-radius: 8px;
            padding: 16px;
        }
        .resultados-title {
            color: #b5bac1;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .resultados-lista {
            max-height: 220px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .resultados-lista::-webkit-scrollbar {
            width: 6px;
        }
        .resultados-lista::-webkit-scrollbar-thumb {
            background: #2b2d31;
            border-radius: 4px;
        }
        .item-codigo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2b2d31;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .item-codigo:last-child {
            margin-bottom: 0;
        }
        .link-codigo {
            color: #00a8fc;
            text-decoration: none;
            font-size: 14px;
            font-family: monospace;
            word-break: break-all;
        }
        .link-codigo:hover {
            text-decoration: underline;
        }
        .btn-copiar {
            background-color: #23a55a;
            padding: 6px 12px;
            font-size: 12px;
        }
        .btn-copiar:hover {
            background-color: #1a7f43;
        }
        .status-msg {
            color: #949ba4;
            font-size: 14px;
            text-align: center;
            padding: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Nitro Generator</h1>
        <p>Byredzzz • V.2.13</p>
    </div>

    <div class="aviso-box">
        <div class="aviso-title">⚠️ Aviso Importante</div>
        <div class="aviso-text">A maioria dos códigos vai dar expirado. Pode demorar até você encontrar um código válido.</div>
    </div>

    <div class="form-group">
        <label for="quantidade">Quantidade de códigos</label>
        <div class="input-row">
            <input type="number" id="quantidade" value="10" min="1">
            <button onclick="iniciarGerador()">Gerar</button>
        </div>
    </div>

    <div class="resultados-wrapper">
        <div class="resultados-title" id="painel-status">Codigos nitro</div>
        <div class="resultados-lista" id="output">
            <div class="status-msg">Os codigos vao aparecer aqui</div>
        </div>
    </div>
</div>

<!-- Input oculto para corrigir o bug de cópia do OneCompiler -->
<textarea id="copiar-helper" style="position: absolute; left: -9999px;"></textarea>

<script>
    function gerarNitro(comprimento) {
        if (!comprimento) comprimento = 16;
        var caracteres = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        var codigo = '';
        for (var i = 0; i < comprimento; i++) {
            var indexAleatorio = Math.floor(Math.random() * caracteres.length);
            codigo += caracteres.charAt(indexAleatorio);
        }
        return 'https://discord.gift/' + codigo;
    }

    function copiarTexto(texto, botao) {
        // Método alternativo e robusto para funcionar dentro do iframe do OneCompiler
        var helper = document.getElementById('copiar-helper');
        helper.value = texto;
        helper.select();
        helper.setSelectionRange(0, 99999);
        
        try {
            document.execCommand('copy');
            var textoOriginal = botao.innerText;
            botao.innerText = 'Copiado!';
            botao.style.backgroundColor = '#1a7f43';
            setTimeout(function() {
                botao.innerText = textoOriginal;
                botao.style.backgroundColor = '#23a55a';
            }, 1500);
        } catch (err) {
            botao.innerText = 'Erro';
            botao.style.backgroundColor = '#f23f43';
        }
    }

    function iniciarGerador() {
        var inputQuantidade = document.getElementById('quantidade');
        var outputDiv = document.getElementById('output');
        var statusPainel = document.getElementById('painel-status');
        var quantidade = parseInt(inputQuantidade.value);

        if (isNaN(quantidade) || quantidade <= 0) {
            outputDiv.innerHTML = '<div class="status-msg" style="color: #f23f43;">Insira um número válido maior que zero.</div>';
            return;
        }

        outputDiv.innerHTML = '<div class="status-msg">Iniciando gerador de códigos...</div>';
        statusPainel.innerText = 'Processando...';
        
        setTimeout(function() {
            statusPainel.innerText = 'Códigos Gerados (' + quantidade + ')';
            outputDiv.innerHTML = '';
            
            for (var i = 0; i < quantidade; i++) {
                var link = gerarNitro(16);
                
                outputDiv.innerHTML += 
                    '<div class="item-codigo">' +
                        '<a href="' + link + '" target="_blank" class="link-codigo">' + link + '</a>' +
                        '<button class="btn-copiar" onclick="copiarTexto(\'' + link + '\', this)">Copiar</button>' +
                    '</div>';
            }
        }, 500);
    }
</script>

</body>
</html>
