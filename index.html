<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discord Nitro Generator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px;
  background: #090909;
  color: #f5f5f5;
  font-family: Arial, sans-serif;
}

main {
  max-width: 620px;
  margin: 55px auto;
}

h1 {
  font-size: 30px;
  margin-bottom: 8px;
}

h1 span {
  color: #ed4245;
}

.subtitle {
  color: #888;
  font-size: 14px;
  margin-bottom: 26px;
}

.controls {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  color: white;
  background: #151515;
  border: 1px solid #333;
  border-radius: 8px;
  outline: none;
}

input:focus {
  border-color: #ed4245;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 12px 16px;
  background: #ed4245;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #c9363a;
}

#status {
  color: #999;
  font-size: 13px;
  margin-top: 14px;
}

#results {
  display: grid;
  gap: 9px;
  margin-top: 18px;
}

.result {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px;
  background: #121212;
  border: 1px solid #292929;
  border-radius: 8px;
}

.result a {
  color: #ddd;
  font: 13px monospace;
  overflow-wrap: anywhere;
  text-decoration: none;
}

.copy {
  flex-shrink: 0;
  padding: 9px 12px;
  background: #292929;
}

.copy:hover {
  background: #414141;
}

@media (max-width: 420px) {
  body {
    padding: 16px;
  }

  h1 {
    font-size: 25px;
  }

  .controls {
    gap: 6px;
  }

  .controls button {
    padding: 12px;
  }
}
</style>
</head>

<body>
<main>
  <h1>Discord <span> Generator.</span></h1>
  <p class="subtitle">
    Gerador de Discord .
  </p>

  <div class="controls">
    <input
      id="amount"
      type="number"
      min="1"
      step="1"
      value="10"
      placeholder="Quantidade"
      aria-label="Quantidade de links"
    >
    <button id="generate">Gerar</button>
  </div>

  <div id="status" aria-live="polite">
    A chance de encontrar um codigo valido e baixa.
  </div>

  <div id="results"></div>
</main>

<script>
const amount = document.getElementById("amount");
const results = document.getElementById("results");
const status = document.getElementById("status");
const generateButton = document.getElementById("generate");

let running = false;

function randomCode(length = 16) {
  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  const bytes = new Uint8Array(length);
  crypto.getRandomValues(bytes);

  return Array.from(bytes, byte => chars[byte % chars.length]).join("");
}

async function copyText(text, button) {
  try {
    await navigator.clipboard.writeText(text);
    button.textContent = "Copiado!";
    setTimeout(() => button.textContent = "Copiar", 1000);
  } catch {
    status.textContent =
      "Não foi possível copiar automaticamente. Selecione o link e copie manualmente.";
  }
}

function addResult(code) {
  const url = "https://discord.gift/" + code;

  const row = document.createElement("div");
  row.className = "result";

  const link = document.createElement("a");
  link.href = url;
  link.textContent = url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";

  const button = document.createElement("button");
  button.className = "copy";
  button.textContent = "Copiar";
  button.addEventListener("click", () => copyText(url, button));

  row.append(link, button);
  results.appendChild(row);
}

async function generate() {
  if (running) return;

  const total = Number(amount.value);

  if (!Number.isSafeInteger(total) || total < 1) {
    status.textContent = "Informe uma quantidade inteira maior que zero.";
    return;
  }

  running = true;
  generateButton.disabled = true;
  results.replaceChildren();

  let generated = 0;

  try {
    // Processa em lotes para evitar congelar a página.
    // Não existe limite fixo de quantidade, mas o navegador
    // continua limitado pela memória e pelo desempenho.
    const batchSize = 100;

    while (generated < total) {
      const batch = Math.min(batchSize, total - generated);
      const fragment = document.createDocumentFragment();

      for (let i = 0; i < batch; i++) {
        const code = randomCode();
        const row = document.createElement("div");
        row.className = "result";

        const link = document.createElement("a");
        link.href = "https://discord.gift/" + code;
        link.textContent = link.href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        const button = document.createElement("button");
        button.className = "copy";
        button.textContent = "Copiar";
        button.addEventListener("click", () =>
          copyText(link.href, button)
        );

        row.append(link, button);
        fragment.appendChild(row);
      }

      results.appendChild(fragment);
      generated += batch;
      status.textContent =
        `Gerados ${generated.toLocaleString("pt-BR")} de ${total.toLocaleString("pt-BR")} links de demonstração.`;

      // Deixa o navegador atualizar a interface entre os lotes.
      await new Promise(resolve => setTimeout(resolve, 0));
    }

    status.textContent =
      `Concluído: ${generated.toLocaleString("pt-BR")} links aleatórios. Nenhum deles é garantido como válido.`;
  } catch {
    status.textContent =
      "A geração parou por falta de memória ou outro erro do navegador.";
  } finally {
    running = false;
    generateButton.disabled = false;
  }
}

generateButton.addEventListener("click", generate);

amount.addEventListener("keydown", event => {
  if (event.key === "Enter") generate();
});
</script>
</body>
</html>
