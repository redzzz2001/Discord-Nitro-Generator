<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111114">
<title>Nitro Generator | Redzzz</title>
<style>
:root{color-scheme:dark;--bg:#111114;--panel:#1b1b20;--field:#121216;--line:#303038;--text:#f5f5f7;--muted:#a3a3ad;--red:#ed4245;--red2:#c9363a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 0%,#3a171c 0%,transparent 48%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(100%,430px);padding:28px;background:var(--panel);border:1px solid #353039;border-radius:16px;box-shadow:0 22px 70px #0007}
.brand{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:7px}
.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--red);font-weight:900;font-size:19px;box-shadow:0 5px 18px #ed424533}
h1{font-size:23px;letter-spacing:-.7px;margin:0;font-weight:800}
.subtitle{text-align:center;color:var(--muted);font-size:13px;margin:0 0 27px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:9px}
.controls{display:flex;gap:10px}
input{width:100%;min-width:0;padding:13px 14px;background:var(--field);border:1px solid var(--line);border-radius:9px;color:var(--text);font:inherit;outline:none}
input:focus{border-color:var(--red);box-shadow:0 0 0 3px #ed42451f}
button{border:0;border-radius:9px;background:var(--red);color:white;padding:0 18px;font:700 14px inherit;font-size:14px;font-weight:750;cursor:pointer;transition:background .15s,transform .15s}
button:hover{background:var(--red2)}button:active{transform:scale(.98)}
#resultados{display:grid;gap:8px;margin-top:17px}
.item{display:flex;align-items:center;gap:9px;padding:10px;background:var(--field);border:1px solid #292930;border-radius:9px;min-width:0}
.codigo{flex:1;min-width:0;overflow-wrap:anywhere;color:#f2b5b7;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.copiar{padding:8px 11px;background:#303038;font-size:12px;flex-shrink:0}.copiar:hover{background:#41414b}
.aviso{font-size:11px;line-height:1.5;color:#858590;text-align:center;margin:18px 0 0}
@media(max-width:390px){main{padding:21px}.controls{gap:7px}button#gerar{padding:0 13px}}
</style>
</head>
<body>
<main>
  <div class="brand"><span class="mark">R</span><h1>Nitro Generator</h1></div>
  <p class="subtitle">Uma ferramenta simples • by Redzzz</p>
  <label for="quantidade">Quantos códigos você quer gerar?</label>
  <div class="controls">
    <input id="quantidade" type="number" min="1" max="100" value="10" inputmode="numeric" aria-describedby="aviso">
    <button id="gerar" type="button">Gerar</button>
  </div>
  <div id="resultados" aria-live="polite"></div>
  <p class="aviso" id="aviso">Gera strings aleatórias para demonstração. Elas não são códigos Nitro válidos.</p>
</main>
<script>
const quantidade=document.getElementById('quantidade');
const resultados=document.getElementById('resultados');
function codigoAleatorio(tamanho=16){
  const chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  const valores=new Uint32Array(tamanho);
  if(window.crypto&&window.crypto.getRandomValues){
    window.crypto.getRandomValues(valores);
    return Array.from(valores,n=>chars[n%chars.length]).join('');
  }
  return Array.from({length:tamanho},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
}
async function copiar(texto,botao){
  try{
    if(navigator.clipboard&&window.isSecureContext) await navigator.clipboard.writeText(texto);
    else{
      const area=document.createElement('textarea');
      area.value=texto;area.style.position='fixed';area.style.opacity='0';
      document.body.appendChild(area);area.select();
      const ok=document.execCommand('copy');area.remove();
      if(!ok)throw new Error('copy failed');
    }
    botao.textContent='Copiado!';
    setTimeout(()=>botao.textContent='Copiar',1200);
  }catch{
    botao.textContent='Falhou';
    setTimeout(()=>botao.textContent='Copiar',1200);
  }
}
function gerar(){
  const total=Number(quantidade.value);
  if(!Number.isInteger(total)||total<1||total>100){
    quantidade.setCustomValidity('Digite um número inteiro entre 1 e 100.');
    quantidade.reportValidity();quantidade.setCustomValidity('');quantidade.focus();return;
  }
  resultados.replaceChildren();
  const fragmento=document.createDocumentFragment();
  for(let i=0;i<total;i++){
    const link='https://discord.gift/'+codigoAleatorio();
    const item=document.createElement('div');item.className='item';
    const texto=document.createElement('span');texto.className='codigo';texto.textContent=link;
    const botao=document.createElement('button');botao.className='copiar';botao.type='button';botao.textContent='Copiar';
    botao.addEventListener('click',()=>copiar(link,botao));
    item.append(texto,botao);fragmento.appendChild(item);
  }
  resultados.appendChild(fragmento);
}
document.getElementById('gerar').addEventListener('click',gerar);
quantidade.addEventListener('keydown',event=>{if(event.key==='Enter')gerar()});
</script>
</body>
</html>
